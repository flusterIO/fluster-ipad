name: Publish Rust crates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish conundrum crates
    steps:
      - uses: actions/checkout@v4
        name: Checkout versioned commit
      - uses: dtolnay/rust-toolchain@stable
        name: Install Rust toolchain
      - name: Publish conundrum crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CARGO_REGISTRY_TOKEN secret is required"; exit 1; }

          publish_crate() {
            local crate="$1"
            local version status attempt
            version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')"
            if [[ -z "$version" || "$version" == "null" ]]; then
              echo "Could not find package $crate in workspace metadata" >&2
              return 1
            fi

            status="$(curl --silent --show-error --user-agent 'Fluster-Cargo-Publisher (https://github.com/flusterIO/fluster-ipad)' --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/$crate/$version")"
            if [[ "$status" == "200" ]]; then
              echo "$crate $version is already published; skipping"
              return 0
            elif [[ "$status" != "404" ]]; then
              echo "Could not check crates.io for $crate $version (HTTP $status)" >&2
              return 1
            fi

            for attempt in 1 2 3; do
              if cargo publish --locked -p "$crate" --token "$CARGO_REGISTRY_TOKEN"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "Publish of $crate failed; retrying in 20 seconds (attempt $((attempt + 1))/3)"
                sleep 20
              fi
            done
            return 1
          }

          publish_crate conundrum_macro_traits
          publish_crate conundrum_macros
          publish_crate conundrum
          publish_crate conundrum_config
          publish_crate conundrum_fs
          publish_crate conundrum_db
          publish_crate conundrum_tools
          publish_crate conundrum_server_rs
          publish_crate conundrum_cli
          publish_crate conundrum_swift
          publish_crate conundrum_wasm
