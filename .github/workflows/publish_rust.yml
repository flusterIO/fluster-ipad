# yaml-language-server: $schema=/Users/bigsexy/dev-utils/jsonSchemas/src/schemas/json/github-workflow.json
name: Publish Rust crates

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish conundrum crates
    steps:
      - uses: actions/checkout@v4
        name: Checkout versioned commit
      - uses: dtolnay/rust-toolchain@stable
        name: Install Rust toolchain
      - name: Publish conundrum crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CARGO_REGISTRY_TOKEN secret is required"; exit 1; }
          cargo publish --locked -p conundrum_macro_traits --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum_config --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum_fs --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum_macros --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum_db --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum_cli --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum_tools --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum_server_rs --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum_swift --token "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked -p conundrum_wasm --token "$CARGO_REGISTRY_TOKEN"
