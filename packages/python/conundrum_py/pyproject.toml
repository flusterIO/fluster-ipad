[project]
name = "conundrum-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fluster.IO", email = "fluster.eyeoh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=1.43.1",
    "surrealdb>=2.0.0",
]

[tool.maturin]
module-name = "conundrum_py._core"
python-packages = ["conundrum_py"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
