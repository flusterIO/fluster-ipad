[package]
name = "conundrum_py"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
conundrum = { path = "../../rust/conundrum/" }
conundrum_server_rs = { path = "../../rust/conundrum_server_rs/" }
conundrum_db = { path = "../../rust/conundrum_db/" }
pyo3-polars = "0.28.0"
pyo3 = { version = "0.29.2", features = ["full"] }
polars = { version = "0.55.2", features = ["lazy"] }
