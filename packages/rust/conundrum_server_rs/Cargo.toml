[package]
name = "conundrum_server_rs"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# crate-type = ["staticlib", "lib"]
name = "cdrm_server_lib"
path = "src/lib.rs"

[[bin]]
name = "cdrm_server"
path = "src/main.rs"

[dependencies]
arrow-array = "58"
arrow-schema = "58"
serde_arrow = { version = "0.14.2", features = ["arrow-58"] }
anyhow = "1.0.103"
askama = "0.16.0"
axum = { version = "0.8.9", features = ["query"] }
bcrypt = "0.19.2"
chrono.workspace = true
crossbeam = "0.8.4"
lazy_static = "1.5.0"
once_cell = "1.21.4"
ratex-layout = "0.1.13"
ratex-parser = "0.1.13"
ratex-svg = "0.1.13"
serde.workspace = true
serde_json.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
typeshare.workspace = true
wildmatch = "2.6.1"
prettycli = "0.1.1"
filetime = "0.2.29"
glob = "0.3.4"
notify = "8.2.0"
glob-match = "0.2.1"
ollama-rs = "0.3.5"
langchain-rust = { version = "4.6.0", features = ["uuid", "ollama", "ollama-rs", "pdf-extract", "opensearch", "git", "fastembed"] }
ignore = "0.4.31"
conundrum = {path = "../conundrum/"}
conundrum_db = {path = "../conundrum_db/"}
gix = {version = "0.86.0", features = ["serde", "merge"]}
# pyo3 = { version = "0.29.0", features = ["anyhow", "auto-initialize", "bigdecimal", "chrono", "either", "uuid"] }

log = "0.4.33"
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
rust-embed = { version = "8.12.0", features = ["axum", "tokio"] }
specta = { workspace = true, features = ["tokio", "chrono", "uuid", "url", "derive"] }
rspc = { version = "0.4.1", features = ["typescript"] }
rspc-axum = { version = "0.3.0", features = ["ws"] }
pretty_env_logger = "0.5.0"
color-eyre = "0.6.5"
globset = "0.4.20"
rfd = "0.17.2"
notify-rust = "4.18.0"
mime-type = "0.2.0"
strum.workspace = true
rust-mcp-sdk = { version = "1.0.1", features = ["rust-mcp-macros"] }
rust-mcp-axum = "1.0.1"
rust-mcp-extra = "1.0.1"
async-trait = "0.1.89"
schemars = { version = "1.2.2", features = ["chrono04", "either1"] }
indoc = "2.0.7"
rig = { version = "0.41.0", features = ["lancedb", "image", "pdf", "rmcp", "memory"] }
rig-lancedb = "0.41.0"
rig-memory = "0.41.0"
lancedb = "0.30.0"

[lints]
workspace = true
