[package]
name = "conundrum_db"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

# [dependencies]
# polars = { workspace = true }


[lints]
workspace = true

[dependencies]
arrow-array = "56.2.0"
dirs = "6.0.0"
once_cell = "1.21.4"
serde.workspace = true
serde_json.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
uuid = { version = "1.23.2", features = ["v4"] }
convert_case = "0.11.0"
conundrum = { path = "../conundrum/" }
schemars = { version = "1.2.1", features = ["chrono04", "either1", "uuid1"] }
either = "1.16.0"
log = "0.4.32"
surrealdb = { version = "3.2.3", features = ["scripting", "kv-mem"] }
askama = "0.16.0"
phf = { version = "0.13.1", features = ["std"] }
quote = "1.0.47"
chrono.workspace = true
strum.workspace = true
indoc = "2.0.7"
syn = "3.0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.50.0", features = ["io-util", "macros", "rt", "sync"] }
