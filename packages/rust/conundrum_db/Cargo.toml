[package]
name = "conundrum_db"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

# [dependencies]
# polars = { workspace = true }


[lints]
workspace = true

[dependencies]
arrow-array = "58"
arrow-schema = "58"
dirs = "6.0.0"
once_cell = "1.21.4"
serde.workspace = true
serde_json.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
uuid = { version = "1.23.2", features = ["v4"] }
convert_case = "0.11.0"
conundrum = { path = "../conundrum/", features = ["db"] }
conundrum_fs = { path = "../conundrum_fs/" }
schemars = { version = "1.2.1", features = ["chrono04", "either1", "uuid1"] }
either = "1.16.0"
log = "0.4.32"
askama = "0.16.0"
phf = { version = "0.13.1", features = ["std"] }
quote = "1.0.47"
chrono.workspace = true
strum.workspace = true
indoc = "2.0.7"
syn = "3.0.3"
apalis-cron = "0.7.4"
tokio-cron-scheduler = "0.15.1"
serde_with = { version = "3.18.0", features = ["base64", "chrono", "json"] }
fake.workspace = true
rust-embed = "8.11.0"
async-trait = "0.1.89"
rayon.workspace = true
go-away = { version = "0.6.1", features = ["all"] }
specta = { workspace = true, features = ["tokio", "chrono", "uuid", "url", "derive"] }
lancedb = "0.30.0"
typeid = "1.0.3"
serde_arrow = { version = "0.14.2", features = ["arrow-58"] }
futures-util = "0.3.33"
pdf-inspector = "0.1.7"
pdf_oxide = { version = "0.3.77", features = ["ml", "ocr-tract", "rendering", "system-fonts"] }
phonenumber = "0.3.10"
test-log = "0.2.21"
chrono-humanize = "0.2.3"
calamine = { version = "0.36.1", features = ["chrono"] }
docx-rs = "0.4.22"
whisper-rs = "0.16.0"
leptess = "0.14.0"
rust-mcp-sdk = { version = "1.0.1", features = ["rust-mcp-macros"] }
# serde_arrow = { version = "0.14.2", features = ["arrow-58"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }
rig = { version = "0.41.0", features = ["lancedb", "image", "pdf", "rmcp", "memory"] }
rig-lancedb = "0.41.0"
rig-memory = "0.41.0"


[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.50.0", features = ["io-util", "macros", "rt", "sync"] }

[dev-dependencies]
fake.workspace = true
