[package]
name = "conundrum_db"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
license.workspace = true

# [dependencies]
# polars = { workspace = true }


[lints]
workspace = true

[dependencies]
arrow-array = "58"
arrow-schema = "58"
dirs = "6.0.0"
once_cell = "1.21.4"
serde.workspace = true
serde_json.workspace = true
strum_macros.workspace = true
thiserror.workspace = true
uuid = { version = "1.23.2", features = ["v4"] }
convert_case = "0.11.0"
conundrum = { path = "../conundrum/" }
conundrum_fs = { path = "../conundrum_fs/" }
schemars = { version = "1.2.1", features = ["chrono04", "either1", "uuid1"] }
either = "1.16.0"
log = "0.4.32"
askama = "0.16.0"
phf = { version = "0.13.1", features = ["std"] }
quote = "1.0.47"
chrono.workspace = true
strum.workspace = true
indoc = "2.0.7"
syn = "3.0.3"
apalis-cron = "0.7.4"
tokio-cron-scheduler = "0.15.1"
serde_with = { version = "3.18.0", features = ["base64", "chrono", "json"] }
fake.workspace = true
rust-embed = "8.11.0"
async-trait = "0.1.89"
rayon.workspace = true
go-away = { version = "0.6.1", features = ["all"] }
specta = { workspace = true, features = ["tokio", "chrono", "uuid", "url", "derive"] }
specta-python = "0.0.1"
lancedb = "0.29.0"
typeid = "1.0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.50.0", features = ["io-util", "macros", "rt", "sync"] }

[dev-dependencies]
fake.workspace = true
