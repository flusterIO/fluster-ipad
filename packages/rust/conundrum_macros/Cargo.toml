[package]
name = "conundrum_macros"
version = "0.1.2"
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
license-file.workspace = true


[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
env_filter = "1.0.1"
conundrum_macro_traits = { path = "../conundrum_macro_traits", version = "0.1.1"}
convert_case = "0.11.0"
prettyplease = "0.2.37"
macrotest = "1.2.1"
log = { version = "0.4.29", features = ["serde"] }
